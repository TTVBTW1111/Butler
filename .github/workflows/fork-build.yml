name: Fork build

# Every push to this fork: a quick compile on Linux, then the Windows installer, uploaded to
# the run's page (Actions › this run › Artifacts). No signing keys needed, nothing released.

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the desktop app and run the shared unit tests
        run: ./gradlew --no-configuration-cache :desktop:compileKotlin :app:testDebugUnitTest --tests "com.cherry.butler.fork.*"

  windows:
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installer
        run: ./gradlew --no-configuration-cache :desktop:createDistributable :desktop:packageMsi
      - name: Name it
        run: |
          version=$(sed -n 's/.*packageVersion = "\(.*\)".*/\1/p' desktop/build.gradle.kts)
          mkdir dist
          cp "desktop/build/compose/binaries/main/msi/Butler-$version.msi" "dist/Butler-$version-fork-${GITHUB_SHA::7}.msi"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Butler-windows-installer
          path: dist/*.msi
          retention-days: 30
